<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasla · وصلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--soft:#EEF0F3;--ink:#0D1524;--muted:#5D6675;--line:#E1E4E9;
  --primary:#0D1524;--primary-2:#1F2A3D;--on-primary:#FFFFFF;--accent:#C6A15B;--on-accent:#0D1524;--accent-ink:#8C6B2E;--accent-soft:#F7F1E4;
  --hero:#0A111E;--hero-ink:#F3F1EC;--hero-muted:#A9AFBA;
  --ok:#1E7A55;--ok-bg:#E4F2EA;--warn:#8C6B2E;--warn-bg:#F7F1E4;--info:#2C4F86;--info-bg:#E8EEF7;--pur:#574A86;--pur-bg:#EEEBF6;
  --err:#B3261E;--r:14px;--rs:10px;--shadow:0 1px 2px rgba(13,21,36,.04),0 12px 32px -18px rgba(13,21,36,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090E18;--surface:#101826;--soft:#172133;--ink:#ECEAE4;--muted:#9AA2B0;--line:#243047;
  --primary:#C6A15B;--primary-2:#D6B574;--on-primary:#0A111E;--accent:#C6A15B;--on-accent:#0A111E;--accent-ink:#D9B878;--accent-soft:#2A2416;
  --hero:#070C15;--hero-ink:#ECEAE4;--hero-muted:#9AA2B0;
  --ok:#6FCF9F;--ok-bg:#12302A;--warn:#D9B878;--warn-bg:#2A2416;--info:#9DB6E6;--info-bg:#18243C;--pur:#BDB0EC;--pur-bg:#231F3B;--err:#FF8A80;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#090E18;--surface:#101826;--soft:#172133;--ink:#ECEAE4;--muted:#9AA2B0;--line:#243047;
  --primary:#C6A15B;--primary-2:#D6B574;--on-primary:#0A111E;--accent:#C6A15B;--on-accent:#0A111E;--accent-ink:#D9B878;--accent-soft:#2A2416;
  --hero:#070C15;--hero-ink:#ECEAE4;--hero-muted:#9AA2B0;
  --ok:#6FCF9F;--ok-bg:#12302A;--warn:#D9B878;--warn-bg:#2A2416;--info:#9DB6E6;--info-bg:#18243C;--pur:#BDB0EC;--pur-bg:#231F3B;--err:#FF8A80;--shadow:none;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.app{max-width:780px;margin:0 auto;padding:0 18px 64px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:1.35rem;display:flex;align-items:center;gap:10px;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.mark{width:34px;height:34px;display:grid;place-items:center}
.mark svg{width:19px;height:19px}
.spacer{flex:1}
.hbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.9rem;color:var(--ink)}
.who{font-size:.88rem;color:var(--muted);max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{max-width:780px;margin:0 auto;padding:0 18px;display:flex;gap:4px;overflow-x:auto}
nav.tabs:empty{display:none}
nav.tabs button{background:transparent;border:0;color:var(--muted);padding:10px 12px 12px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700;line-height:20px;text-align:center}
h1{font-size:1.65rem;line-height:1.25;margin:30px 0 6px;font-weight:700}
h2{font-size:1.15rem;margin:0 0 12px;font-weight:600}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.muted{color:var(--muted)}.k{color:var(--muted);font-size:.8rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
@media(min-width:580px){.two{grid-template-columns:1fr 1fr}}
label{display:block;font-weight:500;font-size:.92rem;margin-bottom:6px}
label small{color:var(--muted);font-weight:400}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;flex:1;min-width:140px;border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;cursor:pointer;font-weight:500;display:flex;gap:9px;align-items:center;background:var(--bg)}
.seg input{width:auto;accent-color:var(--primary)}
.seg label:has(input:checked){border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.d{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;transition:background .15s}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.primary{background:var(--primary);color:var(--on-primary)}.primary:hover{background:var(--primary-2)}
.amber{background:var(--accent);color:var(--on-accent)}
.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500;padding:10px 16px}
.wa{background:#1FA855;color:#fff;font-weight:500;padding:10px 16px}
.sm{padding:7px 13px;font-size:.87rem;border-radius:10px}
.full{width:100%}
.err{color:var(--err);font-size:.9rem;min-height:1.2em;margin:4px 0 0}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.okline{color:var(--ok);font-size:.88rem;font-weight:500}
/* landing */
.hero{background:var(--hero);color:var(--hero-ink);overflow:hidden;position:relative;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.hero .wrap{display:grid;gap:44px;padding-top:68px;padding-bottom:76px;align-items:center;position:relative}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.15fr .85fr}}
.hero .kicker{display:inline-flex;align-items:center;gap:10px;color:var(--accent);font-weight:500;margin-bottom:18px;font-size:.95rem}.hero .kicker::before{content:"";width:28px;height:1px;background:var(--accent)}
.hero h1{font-size:clamp(2.2rem,5.6vw,3.6rem);line-height:1.1;margin:0 0 18px;font-weight:700;letter-spacing:-.015em}
.hero p{color:var(--hero-muted);font-size:1.12rem;max-width:33em;margin:0 0 30px;font-weight:300}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn{padding:14px 26px;font-size:1rem}
.hero .btn.line{background:transparent;color:var(--hero-ink);border:1px solid color-mix(in srgb,var(--hero-ink) 35%,transparent)}
.facts{display:flex;gap:30px;flex-wrap:wrap;margin-top:40px;color:var(--hero-muted);font-size:.92rem}
.facts b{display:block;color:var(--hero-ink);font-size:1.3rem;font-weight:600}
.routeart{position:relative;max-width:420px;width:100%;justify-self:center}
.routeart svg.path{position:absolute;inset:-30px -10px auto auto;width:100%;height:auto;opacity:.5}
.demo-card{position:relative;background:var(--surface);color:var(--ink);border-radius:20px;padding:20px;box-shadow:0 30px 60px -22px rgba(0,0,0,.55)}
.demo-card .top{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.demo-card .pbar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin:14px 0 6px}
.demo-card .pbar i{display:block;height:100%;width:70%;background:var(--accent);border-radius:6px}
.demo-card.two{margin:-14px 34px 0 -18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:.92rem}
@media (prefers-reduced-motion:no-preference){.demo-card .pbar i{animation:grow 2.4s ease-out both .3s}@keyframes grow{from{width:6%}}}
section.band{padding:76px 0}
section.band h2{font-size:clamp(1.55rem,3.4vw,2.1rem);margin:0 0 10px;font-weight:700;line-height:1.25}
section.band .sub{color:var(--muted);max-width:40em;margin:0 0 38px;font-size:1.05rem}
.promises{display:grid;gap:0;border-top:1px solid var(--line)}
.promise{display:grid;gap:6px 40px;padding:30px 0;border-bottom:1px solid var(--line)}
@media(min-width:760px){.promise{grid-template-columns:1fr 1fr;align-items:baseline}}
.promise b{font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.2;font-weight:700}
.promise p{margin:0;color:var(--muted);font-size:1.05rem}
.steps3{display:grid;gap:22px;counter-reset:s}
@media(min-width:760px){.steps3{grid-template-columns:repeat(3,1fr)}}
.step{padding-top:18px;border-top:2px solid var(--accent)}
.step::before{counter-increment:s;content:counter(s);display:block;font-size:1rem;font-weight:700;color:var(--accent-ink);margin-bottom:6px}
.step b{display:block;font-size:1.1rem;margin-bottom:4px}
.step p{margin:0;color:var(--muted)}
.feats{display:grid;gap:14px}
@media(min-width:680px){.feats{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.feats{grid-template-columns:1fr 1fr 1fr}}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.feat .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--primary);margin-bottom:14px}
.feat .ic svg{width:22px;height:22px}
.feat b{display:block;margin-bottom:4px;font-size:1.06rem}
.feat p{margin:0;color:var(--muted);font-size:.95rem}
.feat.star{background:var(--hero);color:var(--hero-ink);border-color:transparent}
.feat.star p{color:var(--hero-muted)}.feat.star .ic{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.emis{display:flex;flex-wrap:wrap;gap:10px}
.emis span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:500}
.closing{background:var(--hero);color:var(--hero-ink);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:24px;padding:44px 32px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.closing h2{margin:0!important;font-size:clamp(1.4rem,3vw,1.9rem)}
.closing p{margin:6px 0 0;opacity:.85}
footer{padding:30px 0 44px;color:var(--muted);font-size:.88rem}
/* auth */
.auth{max-width:440px;margin:40px auto}
.demo-btns{display:flex;gap:8px;flex-wrap:wrap}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:6px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
/* app */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:13px 15px}
.stat b{display:block;font-size:1.35rem;line-height:1.25;font-weight:600}
.stat span{color:var(--muted);font-size:.84rem}
.stat.hot{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:var(--accent-soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-top b{direction:ltr;font-weight:600}
.time{color:var(--muted);font-size:.84rem}
.pill{margin-inline-start:auto;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600}
.tag{border-radius:7px;padding:2px 9px;font-size:.78rem;font-weight:500;background:var(--soft);color:var(--muted)}
.tag.paid{background:var(--ok-bg);color:var(--ok)}
.s-new{background:var(--warn-bg);color:var(--warn)}.s-assigned{background:var(--pur-bg);color:var(--pur)}
.s-returning,.s-returned{background:#FDE7E7;color:var(--err)}
.retlist{list-style:none;margin:10px 0;padding:0}.retlist li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}.retlist li span:nth-child(2){flex:1}
.stops li.rt::before{background:#FDE7E7;color:#B3261E}
.s-picked{background:var(--info-bg);color:var(--info)}.s-delivered{background:var(--ok-bg);color:var(--ok)}
.route{display:grid;grid-template-columns:18px 1fr;column-gap:12px}
.route .dot{width:13px;height:13px;border-radius:50%;margin-top:6px;border:3px solid var(--primary);background:var(--surface)}
.route .dot.to{background:var(--accent);border-color:var(--accent)}
.route .line{border-inline-start:2px dotted var(--line);margin-inline-start:5px;min-height:12px}
.route .stop{padding-bottom:10px}
a.lnk{color:var(--primary);font-weight:500}
.money{border:1px solid var(--line);border-radius:var(--rs);margin:6px 0 14px;overflow:hidden}
.money .mr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px}
.money .mr+.mr{border-top:1px solid var(--line)}
.money .mr.hl{background:var(--accent-soft)}.money .mr.okr{background:var(--ok-bg)}
.money .mr small{display:block;color:var(--muted);font-size:.78rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.assign{display:flex;gap:8px;align-items:center;flex:1;min-width:220px}
.assign select{padding:8px 10px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.otp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.otp input{max-width:120px;text-align:center;letter-spacing:.3em;font-weight:700;direction:ltr}
.zones{display:flex;gap:6px;flex-wrap:wrap}
.toggle{border:0;border-radius:999px;padding:5px 13px;font-size:.83rem;font-weight:600;cursor:pointer}
.toggle.on{background:var(--ok-bg);color:var(--ok)}.toggle.off{background:var(--soft);color:var(--muted)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{margin:0;display:flex;gap:6px;align-items:center;font-weight:400;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.checks input{width:auto;accent-color:var(--primary)}
.note{background:var(--soft);border-radius:var(--rs);padding:15px 17px;font-size:.93rem}
.note ol{margin:6px 0 0;padding-inline-start:20px}
.flash{background:var(--ok-bg);color:var(--ok);border-radius:var(--rs);padding:9px 13px;font-size:.9rem}
.linkbox{display:flex;gap:8px;margin-top:10px}.linkbox input{direction:ltr;font-size:.85rem}
.receipt .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.receipt .row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-weight:700;font-size:1.1rem}
.banner{background:var(--accent-soft);color:var(--warn);border-radius:var(--rs);padding:10px 14px;margin-top:18px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.92rem}
.banner button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
.shopline{display:flex;align-items:center;gap:12px;margin-top:26px}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.center{text-align:center}
.bignum{font-size:2.1rem;font-weight:700;direction:ltr}
.code{display:inline-block;font-size:2rem;font-weight:700;letter-spacing:.35em;padding:8px 16px 8px 24px;border:2px dashed var(--accent);border-radius:var(--rs);direction:ltr;margin:6px 0}
.tl{list-style:none;padding:0;margin:20px auto 0;text-align:start;max-width:320px}
.tl li{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px}
.tl li::before{content:"";width:13px;height:13px;border-radius:50%;border:3px solid var(--line);background:var(--surface);flex:none;margin-top:6px}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.now::before{background:var(--accent);border-color:var(--accent)}
.tl li:not(.done):not(.now){color:var(--muted)}
.secure{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.85rem}
.locbtn{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* driver route */
.scanbig{width:100%;padding:18px;font-size:1.1rem;border-radius:16px}
.routecard{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:20px;margin:16px 0}
.routecard .rh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.routecard .rh b{font-size:1.15rem}
.routecard .rh span{color:var(--hero-muted);font-size:.92rem}
.stops{list-style:none;margin:0 0 16px;padding:0;counter-reset:st}
.stops li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--hero-ink) 14%,transparent)}
.stops li::before{counter-increment:st;content:counter(st);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:color-mix(in srgb,var(--hero-ink) 14%,transparent)}
.stops li.pu::before{background:var(--hero-ink);color:var(--hero)}
.stops li.dv::before{background:var(--accent);color:var(--on-accent)}
.stops .sn{font-weight:600}.stops .ss{color:var(--hero-muted);font-size:.83rem}
.stops a{color:var(--hero-ink);font-size:.85rem;border:1px solid color-mix(in srgb,var(--hero-ink) 30%,transparent);border-radius:9px;padding:5px 10px;text-decoration:none;white-space:nowrap}
.routecard .btn.line{background:transparent;color:var(--hero-ink);border:1px solid color-mix(in srgb,var(--hero-ink) 35%,transparent);font-weight:500}
.routecard .k{color:var(--hero-muted)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,12,30,.62);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.sheet{background:var(--surface);border-radius:var(--r);padding:18px;max-width:440px;width:100%}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18%;border:3px solid var(--accent);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanres{border-radius:var(--rs);padding:14px 16px;margin-top:12px}
.scanres.good{background:var(--ok-bg);color:var(--ok)}.scanres.bad{background:#FDE7E7;color:var(--err)}
.scanres .big{font-size:1.2rem;font-weight:700}
.label{background:#fff;color:#111;border:2px solid #111;border-radius:8px;padding:14px;font-size:.9rem}
.label .lh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px;font-weight:700}
.label .lh .no{font-size:1.3rem;direction:ltr}
.label .qr{display:grid;place-items:center;padding:6px 0 10px}
.label .qr img,.label .qr canvas{width:170px!important;height:170px!important}
.label .blk{border-top:1px solid #999;padding:8px 0}.label .blk .k{color:#555}
.label .cod{border:2px solid #111;text-align:center;padding:8px;font-weight:700;font-size:1.05rem;margin-top:6px}

.hero .micro{margin-top:12px;color:var(--hero-muted);font-size:.88rem}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent-ink);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:10px 0 0;color:var(--muted);max-width:60ch}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.flogo{display:flex;align-items:center;gap:8px;color:var(--ink)}
.podthumb{border:1px solid var(--line);border-radius:8px;padding:0;width:52px;height:52px;overflow:hidden;cursor:pointer;background:none}
.podthumb img{width:100%;height:100%;object-fit:cover;display:block}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr}
.stars button{background:none;border:0;font-size:2.2rem;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:var(--accent)}
.stars-s{color:var(--accent);letter-spacing:1px;direction:ltr;display:inline-block}.stars-s span{color:var(--line)}
.bar{display:grid;grid-template-columns:minmax(90px,30%) 1fr 40px;gap:10px;align-items:center;padding:6px 0;font-size:.92rem}
.bar div{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar b{text-align:end;font-weight:600}
.split{height:12px;border-radius:12px;background:var(--accent);overflow:hidden}.split i{display:block;height:100%;background:var(--primary)}

.loadlist{border:1px solid var(--line);border-radius:var(--rs);padding:10px 14px;margin:0 0 14px}
.loadlist summary{cursor:pointer;font-weight:600}
.loadlist ol{margin:6px 0 0;padding-inline-start:22px;max-height:260px;overflow:auto}
.loadlist li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.loadlist li span:nth-child(2){flex:1}
details.ord{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);margin-bottom:8px}
details.ord>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px}
details.ord>summary::-webkit-details-marker{display:none}
details.ord .sq{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
details.ord .on{flex:1;min-width:0;display:flex;flex-direction:column}
details.ord .on .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.ord[open]>summary{border-bottom:1px solid var(--line)}
details.ord>.card{border:0;box-shadow:none;margin:0}
.labels{display:grid;gap:14px}
@media print{.labels .label{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}}
@media print{body.printing>*:not(#modal){display:none!important}body.printing .overlay{position:static;background:none}body.printing .noprint{display:none!important}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .3s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}}
</style>

function buildStops(did){
  const act=activeOf(did),stops=[],pu={};
  act.filter(o=>o.status==="assigned").forEach(o=>{const s=seller(o.sid);
    if(!pu[o.sid]){pu[o.sid]={id:"p"+o.sid,type:"pu",name:s.shop,sub:`${s.area}، ${emName(s.em)}`,loc:locOf(s),q:`${s.addr?s.addr+", ":""}${s.area}, ${EM_EN[s.em]}, UAE`,orders:[],phone:s.phone};stops.push(pu[o.sid])}
    pu[o.sid].orders.push(o.no)});
  const rt={};returningOf(did).forEach(o=>{const s=seller(o.sid);
    if(!rt[o.sid]){rt[o.sid]={id:"r"+o.sid,type:"rt",name:s.shop,sub:`${s.area}، ${emName(s.em)}`,loc:locOf(s),q:`${s.addr?s.addr+", ":""}${s.area}, ${EM_EN[s.em]}, UAE`,orders:[],phone:s.phone};stops.push(rt[o.sid])}
    rt[o.sid].orders.push(o.no)});
  act.forEach(o=>{const c=o.c;stops.push({id:"d"+o.no,type:"dv",name:c.name,sub:`${c.area}، ${emName(c.em)}`,loc:locOf(c),q:`${c.area}, ${EM_EN[c.em]}, UAE`,orders:[o.no],needs:o.status==="assigned"?"p"+o.sid:null,phone:c.phone})});
  return stops;
}
function routeLen(seq,start){let d=0,p=start;seq.forEach(s=>{if(p)d+=km(p,s.loc);p=s.loc});return d}
function feasible(seq){const seen=new Set();for(const s of seq){if(s.needs&&!seen.has(s.needs))return false;seen.add(s.id)}return true}
function nn(stops,start){const left=[...stops],seq=[],done=new Set();let cur=start;
  while(left.length){const cand=left.filter(s=>!s.needs||done.has(s.needs));
    let best=cand[0];if(cur)best=cand.reduce((b,s)=>km(cur,s.loc)<km(cur,b.loc)?s:b,cand[0]);
    seq.push(best);done.add(best.id);left.splice(left.indexOf(best),1);cur=best.loc}
  return seq}
function optimise(stops,start){
  if(!stops.length)return[];
  let best=null;
  const starts=start?[start]:stops.filter(s=>!s.needs).map(s=>null);
  if(start)best=nn(stops,start);
  else{stops.filter(s=>!s.needs).forEach(s0=>{const rest=stops.filter(s=>s!==s0);const seq=[s0,...nn(rest.map(s=>s.needs===s0.id?{...s,needs:null,_n:s.needs}:s),s0.loc)].map(s=>s._n?{...s,needs:s._n}:s);
    if(!best||routeLen(seq,null)<routeLen(best,null))best=seq})}
  // 2-opt with precedence check
  let improved=true,guard=0;
  while(improved&&guard++<60){improved=false;
    for(let i=0;i<best.length-1;i++)for(let j=i+1;j<best.length;j++){
      const cand=[...best.slice(0,i),...best.slice(i,j+1).reverse(),...best.slice(j+1)];
      if(feasible(cand)&&routeLen(cand,start)+0.01<routeLen(best,start)){best=cand;improved=true}}}
  return best;
}

  $("#brand").textContent=t("brand");$("#logoMark").innerHTML=LOGO(34);$("#langBtn").textContent=t("lang");
  const auth=$("#authBtn"),hash=location.hash.match(/o=([^&]+)/);
  if(hash&&!ui.preview){$("#tabs").innerHTML="";$("#who").textContent="";auth.classList.add("hidden");return renderCustomer(hash[1])}
  if(ui.preview){$("#tabs").innerHTML="";return renderCustomer(null)}
  if(!sess){$("#tabs").innerHTML="";$("#who").textContent="";
    auth.textContent=t("login");auth.dataset.act="goLogin";auth.className="btn primary sm"+(ui.page==="login"?" hidden":"");
    if(ui.page==="admin"){auth.classList.add("hidden");return renderAdmin()}
    return ui.page==="login"?renderLogin():ui.page==="register"?renderRegister():renderHome()}
  auth.textContent=t("logout");auth.dataset.act="logout";auth.className="hbtn";
  if(sess.role==="owner"){$("#who").textContent=t("rOwner");return renderOwner()}
  if(sess.role==="seller"){$("#who").textContent=seller(sess.id).shop;return renderSeller()}
  if(sess.role==="driver"){$("#who").textContent=(driver(sess.id)||{}).name;return renderDriver()}
}

/* ---------- money ---------- */
function payTag(o){return o.pay==="cod"?`<span class="tag">${t("codTag")}</span>`:`<span class="tag paid">${t("paidTag")}</span>`}
function moneyBox(o,mode){
  const R=[];
  if(isRet(o)){R.push(`<div class="mr" style="background:var(--soft)"><span><b>${t("retNoFee")}</b><small>${o.pay==="online"&&mode!=="driver"?t("retOnline"):t("retNoFeeD")}</small></span><strong class="num">${aed(0)}</strong></div>`);return `<div class="money">${R.join("")}</div>`}
  if(mode==="seller"){
    if(o.pay==="online")R.push(`<div class="mr okr"><span>✓ ${t("s_paid")}<small>${t("s_feeLater").replace("{x}",aed(o.fee))}</small></span><strong class="num">${aed(o.total)}</strong></div>`);
    else R.push(`<div class="mr okr"><span>${t("s_cod")}<small>${t("s_codD")}</small></span><strong class="num">${aed(o.price)}</strong></div>`);
    return `<div class="money">${R.join("")}</div>`;
  }
  if(o.pay==="cod")R.push(`<div class="mr hl"><span>${t("m_fromCust")}<small>${t("m_fromCustD")}</small></span><strong class="num">${aed(o.total)}</strong></div>`);
  else{R.push(`<div class="mr okr"><span>✓ ${t("m_custPaid")}<small>${t("m_custPaidD")}</small></span><strong class="num">${aed(0)}</strong></div>`);
    R.push(`<div class="mr"><span class="k">${t("m_feeLater").replace("{x}",aed(o.fee))}</span></div>`)}
  if(mode==="owner"){const n=sellerNet(o);R.push(`<div class="mr"><span class="k">${t("m_ownerNet")}: ${esc(seller(o.sid).shop)}</span><span class="num k">${n>=0?"+":"−"} ${aed(Math.abs(n))}</span></div>`)}
  return `<div class="money">${R.join("")}</div>`;
}

/* ---------- order card ---------- */
function orderCard(o,mode){
  const s=seller(o.sid),c=o.c,d=driver(o.driver);
  let actions="";
  if(mode==="owner"){
    const opts=S.drivers.map(x=>`<option value="${x.id}" ${o.driver===x.id?"selected":""}>${esc(x.name)} · ${activeOf(x.id).length}${x.on?"":" ("+t("offline")+")"}</option>`).join("");
    actions=`${o.status==="delivered"||isRet(o)?`<span class="muted">🛵 ${esc(d?d.name:"")}</span>`:`<div class="assign"><label class="k" for="as-${o.no}" style="margin:0">${t("assignTo")}</label><select id="as-${o.no}" data-assign="${o.no}"><option value="">${t("pickDriver")}</option>${opts}</select></div>`}
      <button class="btn ghost sm" data-act="label" data-no="${o.no}">${t("labelBtn")}</button>`;
  }else if(mode==="seller"){
    actions=`<button class="btn primary sm" data-act="label" data-no="${o.no}">${IC.qr} ${t("labelBtn")}</button><a class="btn wa sm" target="_blank" rel="noopener" href="${esc(wa(c.phone,"#"+o.no))}">${t("waCustomer")}</a>`;
  }else if(mode==="driver"){
    const dl=o.pay==="cod"?t("deliverCash").replace("{x}",aed(o.total)):t("deliver");
    actions=o.status==="assigned"
      ?`<button class="btn primary" data-act="pickup" data-no="${o.no}">${t("pickupBtn")}</button><a class="btn wa sm" target="_blank" rel="noopener" href="${esc(wa(s.phone,"#"+o.no))}">${t("waSeller")}</a><a class="btn ghost sm" href="tel:${digits(s.phone)}">${t("call")}</a>`
      :`<div class="otp"><label class="k" for="otp-${o.no}" style="margin:0">${t("enterOtp")}</label><input id="otp-${o.no}" inputmode="numeric" maxlength="4">
          <label class="btn ghost sm" style="margin:0">${ui.pod&&ui.pod[o.no]?t("podOk"):"📷 "+t("podBtn")}<input type="file" accept="image/*" capture="environment" data-pod="${o.no}" class="hidden"></label>
          <button class="btn primary" data-act="deliver" data-no="${o.no}">${dl}</button></div>
        ${o.attempts?`<div class="k" style="width:100%">${t("lastFail")}: ${esc(t("failR")[o.failReason]||"")} · ${o.attempts} ${t("attempts")}</div>`:""}
        <a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(wa(c.phone,t("onWayMsg").replace("{n}",c.name).replace("{o}","#"+o.no).replace("{s}",s.shop)))}">${t("onWay")}</a>
        <button class="btn ghost sm" data-act="failOpen" data-no="${o.no}">${t("failBtn")}</button>
        <p class="err" id="oerr-${o.no}" role="alert" style="width:100%;margin:0"></p>
        <a class="btn wa sm" target="_blank" rel="noopener" href="${esc(wa(c.phone,"#"+o.no))}">${t("waCustomer")}</a><a class="btn ghost sm" href="tel:${digits(c.phone)}">${t("call")}</a>`;
  }
  const cl=locOf(c);
  return `<article class="card" id="card-${o.no}">
    <div class="card-top"><b>#${o.no}</b><span class="time">${fmtTime(o.at)}</span>${payTag(o)}${(()=>{const r=riskOf(o.c.phone,o);return r&&!isRet(o)?`<span class="tag" style="background:#FDE7E7;color:var(--err)">${t("risk").replace("{n}",r)}</span>`:""})()}<span class="pill s-${o.status}">${t("st_"+o.status)}</span></div>
    <div class="route">
      <span class="dot"></span><div class="stop"><div class="k">${t("from")}</div><strong>${esc(s.shop)}</strong> · <span class="ltr">${esc(s.phone)}</span><div>${esc(s.area)}، ${esc(emName(s.em))}. ${esc(s.addr)}</div><div class="muted">${esc(o.item)}</div></div>
      <span class="line"></span><span></span>
      <span class="dot to"></span><div class="stop"><div class="k">${t("to")}</div><strong>${esc(c.name)}</strong> · <span class="ltr">${esc(c.phone)}</span>
        <div>${esc(c.area)}، ${esc(emName(c.em))}. ${esc(c.addr)}</div><div class="k">${esc(t("slots")[c.slot])}${mode==="owner"&&o.status!=="delivered"?` · ${t("otpShort")} <span class="ltr">${o.otp}</span>`:""}</div>
        ${mode!=="seller"&&o.status!=="delivered"?`<a class="lnk" href="${esc(cl.exact?`https://www.google.com/maps/dir/?api=1&destination=${cl.lat},${cl.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.addr+", "+c.area+", "+EM_EN[c.em]+", UAE")}`)}" target="_blank" rel="noopener">${t("openMap")}</a>`:""}</div>
    </div>
    ${moneyBox(o,mode)}
    ${o.pod||o.rating?`<div class="actions" style="margin:-4px 0 12px">${o.pod?`<button class="podthumb" data-act="podView" data-no="${o.no}" aria-label="${t("podView")}"><img src="${o.pod}" alt=""></button>`:""}${o.rating?`<span class="stars-s" title="${esc(o.rating.c||"")}">${"★".repeat(o.rating.v)}<span>${"★".repeat(5-o.rating.v)}</span></span>${o.rating.c?`<span class="muted" style="font-size:.88rem">«${esc(o.rating.c)}»</span>`:""}`:""}</div>`:""}
    ${o.status==="delivered"&&!o.rating&&mode!=="driver"?`<div class="actions" style="margin:-4px 0 12px"><a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(wa(c.phone,t("askRateMsg").replace("{n}",c.name).replace("{o}","#"+o.no).replace("{u}",trackUrl(o))))}">★ ${t("askRate")}</a></div>`:""}
    ${o.status==="returned"?`<div class="k" style="margin:-4px 0 10px">${esc(t("failR")[o.failReason]||"")}</div>`:""}
    <div class="actions">${actions}</div>
  </article>`;
}

function avgRating(f){const r=S.orders.filter(o=>f(o)&&o.rating);if(!r.length)return"";const a=r.reduce((x,o)=>x+o.rating.v,0)/r.length;return `<span class="tag" style="background:var(--accent-soft);color:var(--accent-ink)">★ ${a.toFixed(1)} · ${r.length}</span>`}

function breakdown(g,who){

    <div class="mr"><span>${t(P+"CashFee")}</span><span class="num">− ${aed(cF)}</span></div>`:""}
    ${g.bank.length?`<div class="mr"><span>${t(P+"OnlineFee").replace("{n}",g.bank.length)}</span><span class="num">− ${aed(oF)}</span></div>`:""}
    ${who==="d"?`<div class="mr hl"><b>${g.net>0?t("stGive"):g.net<0?t("stTake"):t("stEven")}</b><strong class="num" style="font-size:1.15rem">${aed(Math.abs(g.net))}</strong></div>`:""}
  </div>`;

function settleSection(d){

}

/* ---------- scanner ---------- */
let scanStream=null,scanRAF=null;
function stopScan(){if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;if(scanStream){scanStream.getTracks().forEach(tr=>tr.stop());scanStream=null}}
function openScanner(){
  $("#modal").innerHTML=`<div class="overlay" data-act="closeModal"><div class="sheet pop" role="dialog" aria-modal="true" aria-label="${t("scanH")}">
    <h2>${t("scanH")}</h2><p class="muted" style="margin:0 0 12px;font-size:.92rem">${t("scanHint")}</p>
    <div class="cam" id="camBox"><video id="camVid" playsinline muted></video><div class="frame"></div></div>
    <p class="err" id="camErr"></p>
    <div class="actions"><label class="btn ghost sm" style="margin:0">${t("photoScan")}<input type="file" accept="image/*" capture="environment" id="photoIn" class="hidden"></label></div>
    <form class="actions" data-form="manualScan" style="margin-top:12px"><input id="manNo" class="ltr" placeholder="W123456" style="flex:1;min-width:140px" aria-label="${t("typeNo")}"><button class="btn primary sm" type="submit">${t("add")}</button></form>
    <div id="scanRes"></div>
    <div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-act="closeModal">${t("close")}</button></div>
  </div></div>`;
  $("#photoIn").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const code=decodeImage(img);URL.revokeObjectURL(img.src);code?handleScan(code):showScan(false,t("scanNoQR"))};img.src=URL.createObjectURL(f)});
  startCam();
}
async function startCam(){
  const v=$("#camVid");
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=scanStream;await v.play();
    const bd=("BarcodeDetector" in window)?new BarcodeDetector({formats:["qr_code"]}):null;
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const tick=async()=>{if(!scanStream)return;
      if(v.readyState>=2){let code=null;
        if(bd){try{const r=await bd.detect(v);if(r[0])code=r[0].rawValue}catch(e){}}
        else if(typeof jsQR==="function"){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const id=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(id.data,id.width,id.height);if(r)code=r.data}
        if(code){handleScan(code);return}}
      scanRAF=requestAnimationFrame(tick)};
    tick();
  }catch(e){$("#camBox").classList.add("hidden");$("#camErr").textContent=t("camFail")}
}
function decodeImage(img){if(typeof jsQR!=="function")return null;const cv=document.createElement("canvas"),sc=Math.min(1,1200/Math.max(img.width,img.height));cv.width=img.width*sc;cv.height=img.height*sc;
  const cx=cv.getContext("2d");cx.drawImage(img,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(d.data,d.width,d.height);return r?r.data:null}

    const id="s"+uid();S.sellers.push({id,shop,phone,em,area,addr,pin,...b,...(ui.regLoc||{})});save();setSess({role:"seller",id});ui.tab=null;render();window.scrollTo(0,0)},
  addDriver(){const name=$("#dn").value.trim(),phone=$("#dp").value.trim(),zones=[...document.querySelectorAll('input[name=z]:checked')].map(x=>+x.value),err=$("#ferr");
    if(!name||!phone||!zones.length)return err.textContent=t("req");if(digits(phone).length<8)return err.textContent=t("badPhone");
    if([...S.sellers,...S.drivers,S.owner].some(x=>samePhone(x.phone,phone)))return err.textContent=t("phoneTaken");
    const pin=$("#dpin").value.trim()||"1234";S.drivers.push({id:"d"+uid(),name,phone,zones,pin,on:true});save();ui.newDrv={name,phone,pin};render()},
  bank(){const b=readBank();if(!b)return;Object.assign(S.sellers.find(x=>x.id===sess.id),b);save();ui.flash=t("bankSaved");render()},
  rate(){const f=document.querySelector('form[data-form=rate]'),o=S.orders.find(x=>x.no===f.dataset.no);if(!ui.stars)return;o.rating={v:ui.stars,c:$("#rc").value.trim()};ui.stars=0;save();render()},
  adminLogin(){const ph=$("#aph").value.trim(),pin=$("#apin").value.trim();if(!(samePhone(ph,S.owner.phone)&&pin===S.owner.pin))return $("#ferr").textContent=t("badLogin");
    setSess({role:"owner"});ui.tab=null;ui.page="home";render();window.scrollTo(0,0)},
  settings(){const v=$("#gl").value.trim();if(v&&!/^https?:\/\//.test(v))return $("#ferr")&&($("#ferr").textContent=t("req"));S.settings.googleLink=v;save();ui.flash=t("saved");render()},
  manualScan(){const v=$("#manNo").value.trim();if(v)handleScan(v.toUpperCase().startsWith("W")?v:"W"+v)},
  link(){const i=$("#item").value.trim(),a=$("#price").value;if(!i||a==="")return $("#ferr").textContent=t("req");
    const payload={sid:sess.id,i,a:+a,f:+($("#fee").value||0),n:$("#note").value.trim(),k:uid()};
    S.links=S.links||{};S.links[payload.k]=payload;save();
    ui.link={payload,url:location.href.split("#")[0]+"#o="+enc(payload)};render()},
  order(){const f={name:$("#cname").value.trim(),phone:$("#cphone").value.trim(),em:+$("#emirate").value,area:$("#area").value.trim(),addr:$("#addr").value.trim(),map:$("#map").value.trim(),slot:+$("#slot").value,...(ui.custLoc||{})};
    const pay=document.querySelector('input[name=pay]:checked').value,err=$("#ferr");
    if(pay==="cod"&&riskOf(f.phone)>=2){const on=document.querySelector('input[name=pay][value=online]');on.checked=true;ACT.payChange();return err.textContent=t("riskCod")}
    if(!f.name||!f.phone||!f.area||!f.addr)return err.textContent=t("req");if(digits(f.phone).length<8)return err.textContent=t("badPhone");
    const place=()=>{S.orders.push(newOrder(S,ui.cust,f,pay));save();render();window.scrollTo(0,0)};
    if(pay!=="online")return place();
    const cc=digits($("#cc").value),ce=$("#ce").value.trim(),cv=digits($("#cv").value);
    if(cc.length<12||!/^\d{2}\/\d{2}$/.test(ce)||cv.length<3)return err.textContent=t("badCard");
    const btn=$("#custSubmit"),old=btn.textContent;btn.disabled=true;btn.textContent=t("paying");
    setTimeout(()=>{if(cc.endsWith("0002")){btn.disabled=false;btn.textContent=old;err.textContent=t("payFail");return}place()},1300)}
};
document.addEventListener("submit",e=>{const f=e.target.dataset.form;if(f&&FORM[f]){e.preventDefault();const er=$("#ferr");if(er)er.textContent="";FORM[f]()}});
render();
</script></body></html>
